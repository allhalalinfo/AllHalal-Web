name: IndexNow - Auto Submit After Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  submit-to-indexnow:
    name: Submit URLs to IndexNow
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Hetzner deployment
        run: |
          echo "Waiting 110s for Deploy to Hetzner (build + PM2 restart)..."
          sleep 110

      - name: Submit to IndexNow
        env:
          INDEXNOW_API_SECRET: ${{ secrets.INDEXNOW_API_SECRET }}
        run: |
          set -e
          echo "Submitting sitemap URLs via /api/index-now..."

          AUTH_HEADER=()
          if [ -n "$INDEXNOW_API_SECRET" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer ${INDEXNOW_API_SECRET}")
          fi

          # Health check first — endpoint must exist after deploy
          GET_CODE=$(curl -s -o /tmp/indexnow-get.json -w "%{http_code}" \
            https://allhalal.info/api/index-now || true)
          echo "GET /api/index-now -> HTTP ${GET_CODE}"
          cat /tmp/indexnow-get.json || true
          echo

          if [ "$GET_CODE" != "200" ]; then
            echo "Endpoint not ready yet; waiting 45s more..."
            sleep 45
          fi

          RESPONSE=$(curl -s -X POST https://allhalal.info/api/index-now \
            -H "Content-Type: application/json" \
            "${AUTH_HEADER[@]}")

          echo "Response:"
          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"success":true'; then
            echo "Successfully submitted URLs to search engines"
          else
            echo "Submission did not report success — check INDEXNOW_KEY on the server"
            exit 1
          fi

      - name: Summary
        if: success()
        run: |
          echo "IndexNow notified after deploy"
          echo "Monitor: https://search.google.com/search-console"
