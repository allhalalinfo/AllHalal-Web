name: IndexNow - Auto Submit After Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  submit-to-indexnow:
    name: Submit URLs to IndexNow
    runs-on: ubuntu-latest
    
    steps:
      - name: Wait for Vercel deployment
        run: |
          echo "⏳ Waiting 90 seconds for Vercel deployment to complete..."
          sleep 90
      
      - name: Submit to IndexNow
        run: |
          echo "🚀 Submitting all pages to IndexNow (Google, Bing, Yandex)..."
          
          RESPONSE=$(curl -X POST https://allhalal.info/api/index-now \
            -H "Authorization: Bearer ${{ secrets.INDEXNOW_API_SECRET }}" \
            -H "Content-Type: application/json" \
            -w "\nHTTP_STATUS:%{http_code}" \
            -s)
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS/d')
          
          echo "📊 Response:"
          echo "$BODY" | jq '.' || echo "$BODY"
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Successfully submitted URLs to search engines!"
            
            # Extract counts from response
            TOTAL_URLS=$(echo "$BODY" | jq -r '.results | map(.count) | add' 2>/dev/null || echo "unknown")
            BATCHES=$(echo "$BODY" | jq -r '.batches' 2>/dev/null || echo "unknown")
            
            echo "📈 Submitted $TOTAL_URLS URLs in $BATCHES batches"
          else
            echo "❌ Failed to submit URLs. HTTP Status: $HTTP_STATUS"
            exit 1
          fi
      
      - name: Summary
        if: success()
        run: |
          echo "🎉 Deployment complete and URLs submitted to IndexNow!"
          echo "⏰ Search engines will crawl within 1-3 days"
          echo "🔍 Check Google Search Console: https://search.google.com/search-console"
