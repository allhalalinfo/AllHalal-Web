name: Deploy to Hetzner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Hetzner
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          ssh $HETZNER_USER@$HETZNER_HOST "export DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' && bash -s" << 'ENDSSH'
            set -e
            
            echo "🚀 Starting deployment..."
            echo "📁 Deploy path: $DEPLOY_PATH"
            
            # Переходим в директорию проекта
            cd "$DEPLOY_PATH" || { echo "❌ DEPLOY_PATH not found: $DEPLOY_PATH"; exit 1; }
            
            # Проверяем, что мы в git репозитории (первый деплой)
            if [ ! -d .git ]; then
              echo "📦 First deployment - cloning repository..."
              git clone https://github.com/allhalalinfo/AllHalal-Web.git .
            fi
            
            # Сохраняем текущий коммит (для rollback)
            CURRENT_COMMIT=$(git rev-parse HEAD)
            echo "📌 Current commit: $CURRENT_COMMIT"
            
            # Убеждаемся что remote использует HTTPS, не SSH
            CURRENT_REMOTE=$(git config --get remote.origin.url)
            if [[ $CURRENT_REMOTE == git@github.com:* ]]; then
              echo "🔧 Converting SSH remote to HTTPS..."
              git remote set-url origin https://github.com/allhalalinfo/AllHalal-Web.git
            fi
            
            # Обновляем код
            echo "📥 Pulling latest changes..."
            git fetch origin
            git reset --hard origin/main
            
            # Создаем .env файл (если не существует)
            if [ ! -f .env ]; then
              echo "⚙️ Creating .env file..."
              cp .env.example .env
              echo "⚠️ Warning: Please configure .env manually"
            fi
            
            # Устанавливаем зависимости (включая devDependencies для build)
            echo "📦 Installing dependencies..."
            npm ci
            
            # Собираем Next.js приложение
            echo "🔨 Building Next.js application..."
            npm run build
            
            # Перезапускаем через PM2
            echo "▶️ Restarting with PM2..."
            if pm2 describe allhalal-web > /dev/null 2>&1; then
              pm2 reload allhalal-web --update-env
            else
              pm2 start npm --name "allhalal-web" -- start
            fi
            
            pm2 save
            
            # Ждем запуска
            echo "⏳ Waiting for application to start..."
            sleep 5
            
            # Проверяем health check
            echo "🏥 Checking health..."
            if curl -f http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "✅ Deployment successful!"
              pm2 list
            else
              echo "❌ Health check failed, rolling back..."
              git reset --hard $CURRENT_COMMIT
              npm ci
              npm run build
              pm2 reload allhalal-web
              echo "⚠️ Rollback completed. Check logs: pm2 logs allhalal-web"
              exit 1
            fi
            
            echo "🎉 Deployment completed!"
          ENDSSH

      - name: Notify on success
        if: success()
        run: echo "✅ Deployment to Hetzner successful!"

      - name: Notify on failure
        if: failure()
        run: echo "❌ Deployment to Hetzner failed!"
